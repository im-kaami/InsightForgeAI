[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insightforge"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.4.5",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "openai==3.14.0",
    "plotly==7.1.0",
    "kaleido==1.4.0",
    "openpyxl==3.1.5",
    "httpx==0.28.1",
    "sqlglot==30.18.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "sqlalchemy==2.0.53",
    "alembic==1.20.0",
    "PyJWT==2.14.0",
    "argon2-cffi==25.1.0",
    "APScheduler==3.11.3",
    "python-multipart==0.0.32",
    "cryptography==50.0.1",
    "python-dotenv==1.2.3",
    "Markdown==3.10.3",
    "scipy==1.17.1",
    "statsmodels==0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.7",
    "respx==0.23.1",
    "Pillow==12.3.0",
    "notebook==7.6.2",
]
db = [
    "psycopg[binary]==3.3.5",
    "PyMySQL==1.2.0",
]
pdf = ["xhtml2pdf==0.2.19"]

[project.scripts]
insightforge = "insightforge.cli:main"

[tool.setuptools.packages.find]
include = ["insightforge*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs external DB/network"]
addopts = "-m 'not integration' --basetemp=.pytest_tmp"
asyncio_mode = "auto"
